[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-Twilio"
version = "0.4.1"
description = "Receive SMS notifications when OctoPrint jobs are complete."
authors = [
    { name = "Richard Bateman", email = "taxilian@gmail.com" },
]
requires-python = ">=3,<4"
dependencies = [
    "twilio>=6",
    "phonenumbers",
    "cloudinary",
    "sarge",
]
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
smsnotifier = "octoprint_smsnotifier"

[project.urls]
Homepage = "https://github.com/taxilian/OctoPrint-Twilio"

[project.optional-dependencies]
develop = [
    "go-task-bin",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_smsnotifier",
    "octoprint_smsnotifier.*",
]
